# Dependabot: GitHub checks your libraries every week and opens a pull request
# when there is an update, with security fixes flagged. Review and merge it;
# Vercel then deploys the fix.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Pacific/Auckland
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
